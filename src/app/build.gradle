plugins {
    id 'com.android.application'
}

def appVersionName = project.findProperty("versionName") ?: "2.0.4"
def appVersionCode = (project.findProperty("versionCode") ?: "20004").toInteger()

// ============================================================
// Load signing credentials from env file in project root
// (resolved relatively — no hard-coded full path)
// ============================================================
def envFile = new File(rootProject.projectDir, "env")
def envVars = [:]
if (envFile.exists()) {
    envFile.eachLine { rawLine ->
        def line = rawLine.trim()
        if (line && !line.startsWith("#") && line.contains("=")) {
            def idx = line.indexOf("=")
            def key = line.substring(0, idx).trim()
            def val = line.substring(idx + 1).trim()
            if (key.startsWith("export ")) {
                key = key.substring(7).trim()
            }
            if (val.length() >= 2 &&
                    ((val.startsWith('"') && val.endsWith('"')) ||
                     (val.startsWith("'") && val.endsWith("'")))) {
                val = val.substring(1, val.length() - 1)
            }
            envVars[key] = val
        }
    }
} else {
    logger.warn("env file not found: ${envFile.absolutePath}")
}

// Credentials from env file, with system-env fallback
def releaseKeystore  = envVars["KEYSTORE"]   ?: System.getenv("KEYSTORE")
def releaseStorePass = envVars["STORE_PASS"] ?: System.getenv("STORE_PASS")
def releaseKeyAlias  = envVars["KEY_ALIAS"]  ?: System.getenv("KEY_ALIAS") ?: "AppListBackup"
def releaseKeyPass   = envVars["KEY_PASS"]   ?: System.getenv("KEY_PASS")  ?: releaseStorePass

// Resolve keystore relatively: if not absolute, treat as relative to project root
def resolvedKeystore = null
if (releaseKeystore) {
    def kf = new File(releaseKeystore)
    resolvedKeystore = kf.isAbsolute() ? kf : new File(rootProject.projectDir, releaseKeystore)
}

// === OLD: environment-variable based signing (backup) ===
// def releaseKeystore = System.getenv("KEYSTORE")

android {
    namespace "app.arifnurrohim.applistbackup"
    compileSdkVersion 34
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId 'app.arifnurrohim.applistbackup'
        minSdkVersion 21
        //noinspection ExpiringTargetSdkVersion,ExpiredTargetSdkVersion
        targetSdkVersion 34
        versionCode appVersionCode
        versionName appVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            // === OLD: environment-variable based signing (backup) ===
            // if (releaseKeystore) {
            //     storeFile file(releaseKeystore)
            //     storePassword System.getenv("STORE_PASS")
            //     keyAlias System.getenv("KEY_ALIAS") ?: "AppListBackup"
            //     keyPassword System.getenv("KEY_PASS") ?: System.getenv("STORE_PASS")
            // }

            // === NEW: credentials loaded from env file ===
            if (resolvedKeystore != null && resolvedKeystore.exists()) {
                storeFile resolvedKeystore
                storePassword releaseStorePass
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // === OLD: environment-variable based signing (backup) ===
            // if (releaseKeystore) {
            //     signingConfig signingConfigs.release
            // }

            // === NEW: sign release if keystore was resolved ===
            if (resolvedKeystore != null && resolvedKeystore.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    buildFeatures {
        buildConfig = false
    }
}

